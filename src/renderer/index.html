<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Personal Cash Control</title>
    <!-- Basic CSP allowing Google Fonts and local images -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app-container">
      <header class="top-bar">
        <!-- Drag region for hidden titlebar -->
      </header>
      
      <main class="content">
        
        <!-- VIEW: LOGIN -->
        <div id="view-login" class="welcome-card auth-view">
          <img src="assets/logo.jpg" alt="Cash Control Logo" class="logo" style="width: 100px; height: 100px;">
          <h1>Entrar no <span>Cash Control</span></h1>
          <form id="form-login" class="auth-form">
            <input type="text" id="login-username" placeholder="Nome de Usuário" required />
            <input type="password" id="login-password" placeholder="Senha" required />
            <p id="login-error" class="error-msg"></p>
            <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
          </form>
          <p class="auth-switch">Não tem uma conta? <a href="#" id="link-to-register">Cadastre-se</a></p>
        </div>

        <!-- VIEW: REGISTER -->
        <div id="view-register" class="welcome-card auth-view" style="display: none;">
          <img src="assets/logo.jpg" alt="Cash Control Logo" class="logo" style="width: 80px; height: 80px; margin-bottom: 1rem;">
          <h2 style="font-size: 2rem; margin-bottom: 1rem;">Nova <span>Conta</span></h2>
          <form id="form-register" class="auth-form">
            <input type="text" id="reg-name" placeholder="Seu Nome Completo" required />
            <input type="text" id="reg-username" placeholder="Nome de Usuário único" required />
            <input type="password" id="reg-password" placeholder="Senha forte" required />
            <p id="reg-error" class="error-msg"></p>
            <button type="submit" class="btn-primary" id="btn-register">Criar Conta</button>
          </form>
          <p class="auth-switch">Já possui uma conta? <a href="#" id="link-to-login">Faça Login</a></p>
        </div>

        <!-- VIEW: DASHBOARD (Antiga tela) -->
        <div id="view-dashboard" class="welcome-card auth-view" style="display: none;">
          <img src="assets/logo.jpg" alt="Cash Control Logo" class="logo">
          <h1>Olá, <span id="dash-username-display">Usuário</span>!</h1>
          <p>Seu controle financeiro pessoal, agora no desktop.</p>
          <div style="display: flex; gap: 1rem; justify-content: center;">
            <button class="btn-primary" id="btn-start">Testar Banco</button>
            <button class="btn-secondary" id="btn-logout">Sair</button>
          </div>
        </div>

      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
