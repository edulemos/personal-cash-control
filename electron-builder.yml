appId: com.edulemos.cashcontrol
productName: Personal Cash Control
directories:
  output: dist/release
  buildResources: build
files:
  - "src/main/**/*"
  - "src/preload/**/*"
  - "src/shared/**/*"
  - "dist/renderer/**/*"
  - "package.json"
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: "Cash Control"
  artifactName: "${productName} Setup ${version}.${ext}"
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: build/icon.png
  category: public.app-category.finance
  darkModeSupport: true
  artifactName: "${productName} ${version} macOS.${ext}"
dmg:
  title: "${productName} ${version}"
  artifactName: "${productName} ${version}.${ext}"
npmRebuild: false
publish:
  provider: github
  owner: edulemos # Substitua pelo seu usuário no github
  repo: personal-cash-control
